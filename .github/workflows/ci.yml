name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm binutils qemu-system-x86 xorriso

      - name: Run unit tests
        run: |
          set -e
          for t in lexer parser sema codegen build extern loader chip8 baremetal; do
            ruby -I test test/${t}_test.rb
          done

      - name: Run fuzzer
        run: ruby tools/fuzz.rb 500 0

      - name: Verify build tool works on example
        run: |
          ruby main.rb build examples/hello/main.cnd --emit=bin -o /tmp/hello
          /tmp/hello
