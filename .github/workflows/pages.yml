name: Deploy docs site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'tools/mdparser.rb'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Generate site with mdparser.rb
        run: ruby tools/mdparser.rb docs docs_html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs_html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
